<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - VeloraVIP</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --vel-login-bg: #05040b;
            --vel-login-panel: rgba(10, 10, 20, 0.78);
            --vel-login-border: rgba(255, 255, 255, 0.14);
            --vel-login-text: #fbfaff;
            --vel-login-muted: #aaa4b8;
            --vel-login-v: #a855f7;
            --vel-login-i: #22d3ee;
            --vel-login-p: #f59e0b;
        }

        html,
        body {
            min-height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
            color: var(--vel-login-text);
            background:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% -10%, rgba(168, 85, 247, 0.22), transparent 34%),
                linear-gradient(145deg, #03030a, #070413 48%, #090716);
            background-size: 48px 48px, 48px 48px, auto, auto;
        }

        .login-container {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        .login-container::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(120deg, transparent 0 58%, rgba(34, 211, 238, 0.08) 58% 59%, transparent 59% 100%),
                linear-gradient(240deg, transparent 0 62%, rgba(168, 85, 247, 0.1) 62% 63%, transparent 63% 100%);
            opacity: 0.86;
        }

        .login-box {
            position: relative;
            width: min(100%, 430px);
            overflow: hidden;
            padding: clamp(24px, 5vw, 38px);
            border: 1px solid var(--vel-login-border);
            border-radius: 8px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.025)),
                var(--vel-login-panel);
            box-shadow:
                0 26px 90px rgba(0, 0, 0, 0.68),
                0 0 34px rgba(124, 58, 237, 0.22),
                inset 0 1px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px) saturate(150%);
        }

        .login-box::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 3px;
            background: linear-gradient(90deg, var(--vel-login-v), var(--vel-login-i) 52%, var(--vel-login-p));
        }

        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo .logo-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            color: #fff;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04)),
                rgba(168, 85, 247, 0.14);
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.25), inset 0 1px rgba(255, 255, 255, 0.16);
        }

        .login-logo h1 {
            margin: 0;
            color: var(--vel-login-text);
            font-size: clamp(2.05rem, 9vw, 3.05rem);
            line-height: 0.95;
            font-weight: 950;
            letter-spacing: 0;
        }

        .vel-brand-vip {
            display: inline-flex;
            margin-left: 0.08em;
        }

        .vel-brand-vip span {
            display: inline-block;
            text-shadow: 0 0 18px currentColor;
        }

        .vel-brand-vip__v { color: var(--vel-login-v); }
        .vel-brand-vip__i { color: var(--vel-login-i); }
        .vel-brand-vip__p { color: var(--vel-login-p); }

        .login-logo p {
            margin: 12px 0 0;
            color: var(--vel-login-muted);
            font-size: 0.96rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ded8ec;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            min-height: 48px;
            padding: 0 15px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 8px;
            color: #fff;
            background: rgba(4, 4, 10, 0.78);
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .form-group input:focus {
            border-color: rgba(34, 211, 238, 0.74);
            background: rgba(7, 7, 16, 0.92);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14), 0 0 20px rgba(168, 85, 247, 0.18);
        }

        .form-group input::placeholder {
            color: #777084;
        }

        .btn-login {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: linear-gradient(135deg, #8a2be2, #c026d3 52%, #22d3ee);
            box-shadow: 0 14px 34px rgba(138, 43, 226, 0.33), 0 0 24px rgba(34, 211, 238, 0.18);
            font: inherit;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 150ms ease, filter 150ms ease, box-shadow 150ms ease;
        }

        .btn-login:hover,
        .btn-login:focus-visible {
            transform: translateY(-1px);
            filter: brightness(1.08);
            outline: none;
            box-shadow: 0 17px 40px rgba(138, 43, 226, 0.42), 0 0 32px rgba(34, 211, 238, 0.24);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.58;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .error-message,
        .setup-message {
            display: none;
            margin-bottom: 17px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .error-message {
            color: #fecdd3;
            border: 1px solid rgba(244, 63, 94, 0.3);
            background: rgba(127, 29, 29, 0.22);
        }

        .setup-message {
            color: #bff7ff;
            border: 1px solid rgba(34, 211, 238, 0.24);
            background: rgba(8, 145, 178, 0.12);
        }

        .error-message.show,
        .setup-message.show {
            display: block;
        }

        @media (max-width: 420px) {
            .login-box {
                padding: 23px 18px;
            }

            .login-logo .logo-icon {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 187.63 210.6" fill="currentColor" aria-hidden="true">
                    <path d="M169.71,87.87c-4.77,0-9.1,1.88-12.31,4.92L35.3,22.3c.35-1.4.56-2.86.56-4.37C35.86,8.03,27.83,0,17.93,0S0,8.03,0,17.93c0,8.44,5.84,15.5,13.69,17.4v140c-7.71,2.01-13.41,8.99-13.41,17.33,0,9.9,8.03,17.93,17.93,17.93s17.93-8.03,17.93-17.93c0-1.56-.22-3.07-.6-4.51l121.21-69.98c3.26,3.42,7.86,5.55,12.95,5.55,9.9,0,17.93-8.03,17.93-17.93s-8.03-17.93-17.93-17.93ZM152.78,99.92c-.14.41-.27.83-.38,1.25h-51.47l-44.18-24.72L30.4,30.8c.33-.32.64-.65.94-.99l121.45,70.12ZM22.17,175.2V35.33c.23-.05.45-.11.67-.17l26.35,45.65-.34,50.04-25.74,44.59c-.31-.09-.63-.17-.95-.24ZM31.52,180.69c-.27-.3-.55-.6-.84-.89l25.48-44.13,44.64-25.78h51.47c.07.32.15.63.24.94L31.52,180.69Z" />
                </svg>
                <h1>Velora<span class="vel-brand-vip"><span class="vel-brand-vip__v">V</span><span class="vel-brand-vip__i">I</span><span class="vel-brand-vip__p">P</span></span></h1>
                <p id="login-subtitle">Connectez-vous pour continuer</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="setup-message" id="setup-message">
                Bienvenue. Cr&eacute;ez le compte administrateur pour commencer.
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Entrez votre nom d'utilisateur">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" minlength="6" placeholder="Entrez votre mot de passe">
                </div>

                <button type="submit" class="btn-login" id="submit-btn">Se connecter</button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = error;
            errorMessage.classList.add('show');
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        let isSetupMode = false;

        async function checkSetupRequired() {
            try {
                const response = await fetch('/api/auth/setup-required');
                const data = await response.json();

                if (data.setupRequired) {
                    isSetupMode = true;
                    document.getElementById('login-subtitle').textContent = 'Cr\u00e9ation du compte administrateur';
                    document.getElementById('submit-btn').textContent = 'Cr\u00e9er le compte';
                    document.getElementById('setup-message').classList.add('show');
                    document.getElementById('password').placeholder = 'Minimum 6 caract\u00e8res';
                    return;
                }
            } catch (err) {
                console.error('Error checking setup status:', err);
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            const errorMessage = document.getElementById('error-message');

            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            submitBtn.disabled = true;
            submitBtn.textContent = 'Veuillez patienter...';

            try {
                const endpoint = isSetupMode ? '/api/auth/setup' : '/api/auth/login';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Connexion impossible');
                }

                localStorage.setItem('authToken', data.token);
                window.location.replace('/?paid=1');
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = isSetupMode ? 'Cr\u00e9er le compte' : 'Se connecter';
            }
        });

        checkSetupRequired();
    </script>
</body>

</html>
